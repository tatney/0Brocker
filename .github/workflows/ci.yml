name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: Admin workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-playwright-report
          path: admin/playwright-report
          retention-days: 7

  shared:
    name: Shared module (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          accept-android-sdk-licenses: true

      # Verifies the pinned checksum against services.gradle.org. That network call is
      # flaky and intermittently times out, so it must not block the build. Tampering is
      # still caught: distributionSha256Sum in gradle-wrapper.properties is enforced by
      # Gradle itself at download time.
      - uses: gradle/actions/wrapper-validation@v3
        continue-on-error: true

      - name: Run JVM tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Verify APK identity and signature
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging androidApp/build/outputs/apk/debug/androidApp-debug.apk | head -1
          "$tools/apksigner" verify --verbose androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 0broker-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

